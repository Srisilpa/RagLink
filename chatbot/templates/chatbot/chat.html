<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAGLink AI Assistant</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* Header */

.header{
    background:white;
    padding:18px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#1e3a8a;
}

.user{
    font-size:17px;
}

.logout{
    text-decoration:none;
    margin-left:20px;
    background:#dc3545;
    padding:10px 18px;
    border-radius:8px;
    color:white;
}

.logout:hover{
    background:#bb2d3b;
}

/* Chat Container */

.chat-container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    height:78vh;
}

/* Chat Box */

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

/* Messages */

.message{
    margin-bottom:18px;
    padding:16px;
    border-radius:12px;
    max-width:75%;
    line-height:1.6;
}

.bot{
    background:#edf3ff;
    color:#1e3a8a;
}

.user-msg{
    background:#1e3a8a;
    color:white;
    margin-left:auto;
}

/* Chat Input */

.chat-input{
    display:flex;
    padding:20px;
    border-top:1px solid #ddd;
}

.chat-input input{
    flex:1;
    padding:15px;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}

.chat-input input:focus{
    border-color:#1e3a8a;
}

.chat-input button{
    margin-left:15px;
    padding:15px 28px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.chat-input button:hover{
    background:#173074;
}

.chat-input button:disabled{
    background:#888;
    cursor:not-allowed;
}

/* Loading */

.loading{
    font-style:italic;
    color:#666;
}

</style>

</head>

<body>

<!-- Header -->

<div class="header">

    <div class="logo">
        RAGLink
    </div>

    <div class="user">

        Welcome

        <b>{{ request.user.username }}</b>

        <a href="{% url 'logout' %}" class="logout">
            Logout
        </a>

    </div>

</div>


<!-- Chat Container -->

<div class="chat-container">

    <!-- Chat Messages -->

    <div class="chat-box" id="chatBox">

        <div class="message bot">

            <b>👋 Welcome to RAGLink AI Assistant</b>

            <br><br>

            Ask me anything related to

            <ul>

                <li>Company Policies</li>

                <li>HR Documents</li>

                <li>Projects</li>

                <li>Technical Documents</li>

                <li>Knowledge Base</li>

            </ul>

        </div>

    </div>


    <!-- Input -->

    <div class="chat-input">

        <input
            type="text"
            id="question"
            placeholder="Ask your question..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>

async function sendMessage(){

    const input = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");
    const question = input.value.trim();

    // Do nothing if input is empty
    if(question === ""){
        return;
    }

    const chat = document.getElementById("chatBox");


    // Display user's question

    chat.innerHTML += `

        <div class="message user-msg">

            ${escapeHTML(question)}

        </div>

    `;


    // Display loading message

    const loadingMessage = document.createElement("div");

    loadingMessage.className = "message bot loading";

    loadingMessage.id = "loading";

    loadingMessage.innerText = "Thinking...";

    chat.appendChild(loadingMessage);


    // Scroll to bottom

    chat.scrollTop = chat.scrollHeight;


    // Clear input

    input.value = "";


    // Disable send button

    sendButton.disabled = true;


    try{

        // Send request to Django backend

        const response = await fetch("/chatbot/chat/", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify({

                message: question

            })

        });


        // Check HTTP response

        if(!response.ok){

            throw new Error(
                "Server returned status " + response.status
            );

        }


        // Convert response to JSON

        const data = await response.json();


        // Remove loading message

        const loading = document.getElementById("loading");

        if(loading){

            loading.remove();

        }


        // Get answer from backend

        const answer = data.answer || 
            "Sorry, I couldn't generate an answer.";


        // Display answer only
        // Sources are intentionally not displayed

        chat.innerHTML += `

            <div class="message bot">

                ${formatAnswer(answer)}

            </div>

        `;


        // Scroll to bottom

        chat.scrollTop = chat.scrollHeight;


    }

    catch(error){

        console.error("Chat error:", error);


        // Remove loading message

        const loading = document.getElementById("loading");

        if(loading){

            loading.remove();

        }


        // Display error message

        chat.innerHTML += `

            <div class="message bot">

                Unable to contact the server.
                Please try again.

            </div>

        `;


        chat.scrollTop = chat.scrollHeight;

    }

    finally{

        // Enable send button

        sendButton.disabled = false;

        // Focus input

        input.focus();

    }

}


/*
    Convert plain text into safe HTML.

    This prevents user input from being
    interpreted as HTML or JavaScript.
*/

function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/*
    Format the answer returned by the backend.

    New lines are converted into <br>
    so that the answer is displayed properly.
*/

function formatAnswer(text){

    return escapeHTML(text)
        .replace(/\n/g, "<br>");

}


/*
    Press Enter to send the message.
*/

document
    .getElementById("question")
    .addEventListener("keypress", function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    });

</script>

</body>
</html>
